# =========================================================
# SIT722 - Task 7.2C : Extending the CI Testing
#
# CI Pipeline for the KoalaTech University microservices application.
#
#   Job 1  backend-test    -> runs pytest for all 5 backend services against
#                             a real PostgreSQL 16 service container
#   Job 2  frontend-test   -> runs the Vitest suite for the React frontend
#                             (ADDED IN TASK 7.2C)
#   Job 3  build-and-push  -> builds the 6 Docker images and pushes them to
#                             Azure Container Registry (only if Jobs 1 AND 2
#                             both passed)
#
# TASK 7.2C CHANGE:
#   Task 7.1P tested only the five FastAPI backend services. The frontend was
#   built and pushed to ACR without a single test ever running against it.
#   This file closes that gap by adding a `frontend-test` job and listing it
#   in the `needs:` block of `build-and-push`, so a failing frontend test now
#   blocks the build & push stage exactly like a failing backend test does.
#
# NODE 20 DEPRECATION FIX (Task 7.1P requirement):
#   The original workflow used actions that still run on the Node 20 runtime,
#   which GitHub has deprecated. Each action has been upgraded to the first
#   major version that ships a Node 24 runtime:
#
#     actions/checkout@v4      (node20)  ->  actions/checkout@v5      (node24)
#     actions/setup-python@v5  (node20)  ->  actions/setup-python@v6  (node24)
#     azure/login@v2           (node20)  ->  azure/login@v3           (node24)
#
#   This removes the warning:
#     "Node.js 20 is deprecated. The following actions target Node.js 20
#      but are being forced to run on Node.js 24: ..."
# =========================================================

name: CI Pipeline

on:
  # Automatic trigger: any push to the main branch of this repository.
  # This is what allows Task 7.1P Step 4 to be demonstrated by simply
  # editing a comment in this file and pushing the change.
  push:
    branches:
      - main

  # Manual trigger for the workflow
  workflow_dispatch:


jobs:

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Frontend Tests                    *** ADDED IN TASK 7.2C ***
  # =========================================================
  # The frontend is a React 19 + Vite 6 application. Its test suite is
  # Vitest running in a jsdom environment, with React Testing Library
  # supplying the render/query helpers. package.json already exposes:
  #
  #     "test"     : "vitest"            <- watch mode, never use in CI
  #     "test:run" : "vitest run"        <- single pass, exits with a code
  #
  # CI must use `test:run`. The plain `test` script starts Vitest in watch
  # mode, which never exits, so the job would hang until the runner timed
  # out instead of reporting pass or fail.
  # =========================================================
  frontend-test:
    name: Test frontend
    runs-on: ubuntu-latest

    # src/config/serviceUrls.js validates these five variables at import
    # time and throws "Missing environment variable: ..." if any is absent.
    # That module is pulled in by the API client, so without these values
    # the Login and serviceUrls suites fail before a single assertion runs.
    # Vite exposes any VITE_-prefixed process variable through
    # import.meta.env, so setting them here is enough - no .env file needed.
    # The values are placeholders: every network call in the suite is mocked
    # with vi.mock(), so nothing is ever actually requested from these URLs.
    env:
      VITE_USER_SERVICE_URL: http://localhost:8000
      VITE_STUDENT_SERVICE_URL: http://localhost:8001
      VITE_LECTURER_SERVICE_URL: http://localhost:8002
      VITE_COURSE_SERVICE_URL: http://localhost:8003
      VITE_ENROLLMENT_SERVICE_URL: http://localhost:8004

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        # setup-node@v4 runs on node20; @v5 is the first Node 24 release,
        # keeping this job consistent with the Task 7.1P deprecation fix.
        uses: actions/setup-node@v5
        with:
          node-version: "22"

          # Cache the npm download cache between runs, keyed on the
          # frontend lockfile, so repeat runs skip re-downloading packages.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run tests
        working-directory: frontend
        run: |
          npm run test:run


  # =========================================================
  # Build and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # THE QUALITY GATE.
    # Every leg of backend-test AND the frontend-test job must succeed
    # before any image is built. If either job fails, GitHub marks this
    # job "skipped" and nothing reaches the registry.
    #
    # frontend-test was added to this list in Task 7.2C - previously the
    # frontend image could be published even though it had never been
    # tested.
    needs:
      - backend-test
      - frontend-test

    # Build and push when code is pushed to main or manually triggered
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Registry identity is written in-line rather than read from the
      # repository variables used in Task 7.1P. The original ACR was deleted
      # after Task 6.1P, so vars.ACR_NAME / vars.ACR_LOGIN_SERVER still point
      # at a registry that no longer exists, which is what made run #3 fail
      # at this step. The replacement registry is sanjaiweek07acr, in
      # resource group deakinuni (australiaeast).
      - name: Login to Azure Container Registry
        run: |
          az acr login --name sanjaiweek07acr

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t sanjaiweek07acr.azurecr.io/${{ matrix.image }}:${{ github.sha }} \
            -t sanjaiweek07acr.azurecr.io/${{ matrix.image }}:latest \
            ./${{ matrix.service }}

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            sanjaiweek07acr.azurecr.io/${{ matrix.image }}:${{ github.sha }}

      - name: Push Docker image with latest tag
        run: |
          docker push \
            sanjaiweek07acr.azurecr.io/${{ matrix.image }}:latest
